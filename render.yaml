services:
  - type: web
    name: ndb-assistant-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ndb-assistant-web.onrender.com
      - key: DATABASE_URL
        value: sqlite:///./bank_assistant.db
      - key: SEED_DEMO
        value: "false"
  - type: static
    name: ndb-assistant-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ndb-assistant-api.onrender.com